spring.application.name=MarketingAgentFactoryV2

# Spring ai
spring.ai.vertex.ai.gemini.project-id=marketingagentfactoryv2
spring.ai.vertex.ai.gemini.location=europe-west1

# H2 Database Config
spring.datasource.url=jdbc:mysql://localhost:3306/MarketingAgentFactoryV2?createDatabaseIfNotExist=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

# Actuator
management.endpoints.web.exposure.include=*

# JWT Configuration
jwt.secret=mySecretKey1234567890abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ
jwt.expiration=3600000